<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadFlow - Document & Book Reader</title>
  <link rel="icon" type="image/png" id="reader-favicon" href="logo.png">
  <link rel="stylesheet" href="pdf-reader.css">
  <script>
    try {
      chrome.storage.local.get(['pdfTheme'], (res) => {
        if (res && res.pdfTheme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      });
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="overflow-hidden">
  <div id="root"></div>
  <script src="pdf-reader.js"></script>
</body>
</html>
