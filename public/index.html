<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge TTS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


    <p class="description">
      Hover over text on any webpage. Click the Play icon that appears.
    </p>

    <div class="field">
      <div class="field-header">
        <label>Voice</label>
      </div>
      <select id="voice-select">
        <option value="en-US-AriaNeural">Aria (Female)</option>
        <option value="en-US-GuyNeural">Guy (Male)</option>
        <option value="en-GB-SoniaNeural">Sonia (Female, UK)</option>
        <option value="en-GB-RyanNeural">Ryan (Male, UK)</option>
        <option value="en-AU-NatashaNeural">Natasha (Female, AU)</option>
        <option value="en-AU-WilliamNeural">William (Male, AU)</option>
      </select>
    </div>

    <div class="field">
      <div class="field-header">
        <label>Speed</label>
        <span id="speed-label" class="speed-badge">0%</span>
      </div>
      <input type="range" id="rate-slider" min="-50" max="100" value="0">
    </div>

    <div class="field">
      <div class="field-header">
        <label>Status on this site</label>
      </div>
      <button id="toggle-site-btn" style="width: 100%; padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid #e2e8f0; background: #f8fafc; font-family: inherit; font-size: 14px; font-weight: 500; transition: all 0.2s;">Loading...</button>
    </div>

    <div class="field" style="margin-top: 4px;">
      <button id="open-pdf-btn" class="pdf-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M10 13v-2a1 1 0 0 1 1-1h1a2 2 0 0 1 0 4h-2"/><path d="M9 17v-4"/></svg>
        <span>Open PDF Reader</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto; opacity: 0.7;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </div>


  <script src="popup.js"></script>
</body>
</html>
